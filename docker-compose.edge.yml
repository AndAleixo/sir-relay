# VPS behind sir-edge: join sir_edge with stable aliases (no Caddy in this stack).
# Prerequisite: docker network create sir_edge
# Usage: docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d
services:
  app:
    networks:
      internal:
      sir_edge:
        aliases:
          - sirrelay-app

  umami:
    networks:
      internal:
      sir_edge:
        aliases:
          - sirrelay-umami

networks:
  sir_edge:
    external: true
    name: sir_edge
