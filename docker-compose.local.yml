# Prod-local — CADDY_HTTP_PORT from .env (8080). Sibling slearn: 8081 / 5434 / 3002.
services:
  postgres:
    ports:
      - "5433:5432"
  umami:
    ports:
      - "3001:3000"
  caddy:
    ports: !override
      - "${CADDY_HTTP_PORT}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
