services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sirrelay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirrelay -d sirrelay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sirrelay:${POSTGRES_PASSWORD}@postgres:5432/sirrelay
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-internal@localhost.localdomain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

  # Phase 2 — self-hosted analytics (optional)
  # umami:
  #   image: ghcr.io/umami-software/umami:postgresql-latest
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql://sirrelay:${POSTGRES_PASSWORD}@postgres:5432/umami
  #     APP_SECRET: ${UMAMI_APP_SECRET}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
